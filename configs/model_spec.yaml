version: 1
contract_version: "1.0.0"
status: frozen_candidate

project:
  purpose: vehicle_insurance_cross_sell_response_prediction
  target: Response
  decision_unit: one_customer_campaign_opportunity

model:
  family: LightGBM
  class_weighting:
    method: scale_pos_weight
    scale_pos_weight: 7.159039820166988
  hyperparameters:
    boosting_type: gbdt
    objective: binary
    n_estimators: 700
    learning_rate: 0.03
    num_leaves: 31
    max_depth: -1
    min_child_samples: 100
    min_child_weight: 0.001
    min_split_gain: 0.0
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_alpha: 1.0
    reg_lambda: 1.0
    random_state: 42
    n_jobs: -1
    verbosity: -1

features:
  identifier:
    - id
  raw_inputs:
    - Gender
    - Age
    - Driving_License
    - Region_Code
    - Previously_Insured
    - Vehicle_Age
    - Vehicle_Damage
    - Annual_Premium
    - Policy_Sales_Channel
    - Vintage
  target:
    - Response
  categorical:
    - Gender
    - Vehicle_Age
    - Vehicle_Damage
    - Region_Code
    - Policy_Sales_Channel
  passthrough:
    - Age
    - Annual_Premium
    - Vintage
    - Driving_License
    - Previously_Insured
  preprocessing:
    categorical_encoding: one_hot
    one_hot_drop: null
    handle_unknown: ignore
    remainder: drop
    train_only_transformed_feature_count: 219
    final_transformed_feature_count: 220

selection:
  score_name: response_propensity_score
  api_compatibility_name: probability
  capacity_type: top_k_percentage
  top_k_percentage: 10
  rule: highest_scoring_customers
  tie_break: ascending_id
  k_calculation: floor

data_protocol:
  target_available_during_training: true
  target_available_during_live_scoring: false
  split_protocol: stratified_80_10_10
  train_ratio: 0.8
  validation_ratio: 0.1
  test_ratio: 0.1
  random_state: 42
  test_evaluation: completed_once

evaluation_policy:
  purpose: production_candidate_acceptance_and_release_readiness
  primary_metrics:
    - precision_at_10pct
    - lift_at_10pct
  supporting_metrics:
    - recall_at_10pct
    - pr_auc
    - roc_auc
  threshold_metrics:
    - accuracy
    - precision
    - recall
    - f1_score
  frozen_reference_metrics:
    pr_auc: 0.373937
    roc_auc: 0.859726
    precision_at_10pct: 0.396221
    recall_at_10pct: 0.323271
    lift_at_10pct: 3.232797
  final_test:
    usage: reporting_only
    reusable_for_promotion: false
    evaluation_count: 1
  stability:
    required: true
    method: repeated_stratified_cross_validation
    folds: 3
    repeats: 3
    selection_metrics: [pr_auc, precision_at_10pct, recall_at_10pct, lift_at_10pct]
  segment_analysis:
    required_before_production_claims: true
    minimum_segment_sample_size: configurable_by_audit_policy
    insufficient_sample_behavior: suppress_or_group_segment
  parity:
    source_frozen_prediction_parity_required: true
    block_release_on_failure: true
  missing_metric_behavior: reject_candidate
  promotion:
    enabled: false
    status: blocked_until_practical_improvement_threshold_approved
    required_before_enablement:
      - validation_based_comparison
      - practical_improvement_or_non_inferiority_threshold
      - stability_gate
      - source_frozen_parity
      - required_segment_review

artifacts:
  mlflow_tracking:
    source_tuning_run_id: e573ee5423434e6485404a96ca5f5731
    reference_final_run_id: dc28826afdcc4e5cbce068db62439094
    reference_final_model_id: m-3aacf46fc018452ab9aab96033eb7e56
    reference_final_model_uri: models:/m-3aacf46fc018452ab9aab96033eb7e56

future_work:
  - probability_calibration_study
  - configurable_company_specific_capacity
  - additional_feature_mapping_or_retraining_for_customer_schemas
