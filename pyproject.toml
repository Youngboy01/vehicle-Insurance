[project]
name = "vehicle_insurance"
version = "0.1.0"
description = "Vehicle Insurance MLOps Project"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.135.2",
    "imblearn>=0.0",
    "ipykernel>=7.2.0",
    "jinja2>=3.1.6",
    "lightgbm>=4.6.0",
    "matplotlib>=3.8.0",
    "mlflow>=3.10.1",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pandera>=0.30.1",
    "pydantic>=2.12.5",
    "pymongo>=4.6.0",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.0",
    "setuptools>=82.0.1",
    "uvicorn>=0.42.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
